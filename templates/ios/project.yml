# Проект Xcode генерируется из этого файла: `xcodegen generate`. Сам .xcodeproj в
# .gitignore (кроме Package.resolved). Так агент добавляет файлы без правки
# pbxproj, а в git нет вечных конфликтов проектного файла. Новые файлы в папке
# <App>/ подхватываются сами.
name: {{APP}}
options:
  bundleIdPrefix: {{BUNDLE_PREFIX}}
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "{{APPLE_TEAM_ID}}"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
configs:
  Debug: debug
  Release: release
packages:
  # [firebase]
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "{{FIREBASE_IOS_VERSION}}"
  # [google-sign-in]
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "{{GOOGLE_SIGN_IN_VERSION}}"
  # [posthog]
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "{{POSTHOG_IOS_VERSION}}"
targets:
  {{APP}}:
    type: application
    platform: iOS
    sources:
      - path: {{APP}}
        # Правила папок лежат рядом с кодом, но в бандл не едут: одинаковые имена
        # из разных папок валят сборку («Multiple commands produce AGENTS.md»).
        excludes:
          - "**/AGENTS.md"
          - "**/CLAUDE.md"
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    info:
      path: {{APP}}/Info.plist
      properties:
        CFBundleDisplayName: {{PROJECT}}
        # XcodeGen сам MARKETING_VERSION в Info.plist не переносит (пишет 1.0).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Локальный бэкенд в Debug по http: разрешён только localhost.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # [railway]
        # Адрес API приходит из xcconfig конфигурации, а не из кода: у Debug и
        # Release разные бэкенды, и перепутать их сборкой нельзя.
        API_BASE_URL: $(API_BASE_URL)
        # [firebase]
        # Хост эмуляторов в Debug (localhost), пусто в Release.
        FIREBASE_EMULATOR_HOST: $(FIREBASE_EMULATOR_HOST)
        # [google-sign-in]
        # Без GIDClientID SDK бросает исключение и роняет приложение, поэтому
        # провайдер в коде ещё и проверяет, что значение не пустое.
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        # [google-sign-in]
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_IOS_URL_SCHEME)
    entitlements:
      path: {{APP}}/{{APP}}.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: {{BUNDLE_ID}}
        # SwiftLint в фазе сборки читает исходники, песочница скриптов ему мешает.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$PATH:/opt/homebrew/bin"
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint --config "${SRCROOT}/.swiftlint.yml"
          else
            echo "warning: SwiftLint не установлен (brew install swiftlint)"
          fi
    dependencies:
      # [firebase]
      - package: Firebase
        product: FirebaseCore
      # [firebase]
      - package: Firebase
        product: FirebaseAuth
      # [google-sign-in]
      - package: GoogleSignIn
        product: GoogleSignIn
      # [posthog]
      - package: PostHog
        product: PostHog
